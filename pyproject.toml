[project]
name = "furniture-fastapi"
version = "0.1.0"
description = "Furniture price prediction website and FastAPI API gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.116.0",
    "jinja2>=3.1.0",
    "pydantic",
    "python-multipart>=0.0.20",
    "scikit-learn>=1.5.0",
    "uvicorn",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"